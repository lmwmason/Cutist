[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
monitor_speed = 9600
board_build.f_cpu = 4000000L
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=16
    -D SERIAL_TX_BUFFER_SIZE=16

lib_deps =
    arduino-libraries/Servo@^1.2.2
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    SPI
    Wire
